<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#10101c">

    <meta name="description"
          content="LUDO ROYALE - Experience intelligent Ludo gaming with friends or AI opponents.">

    <title>LUDO ROYALE | Play Beyond Limits</title>

    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="css/board.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">
</head>

<body>

    <div id="app">

        <!-- MAIN MENU -->

        <main class="main-screen" id="mainScreen">

            <header class="top-bar">

                <div class="brand">
                    <span class="brand-icon">♛</span>
                    <span>LUDO <strong>ROYALE</strong></span>
                </div>

                <button class="icon-button"
                        id="settingsButton"
                        aria-label="Settings">
                    ⚙
                </button>

            </header>


            <section class="hero">

                <div class="hero-badge">
                    ✦ THE ROYALE EXPERIENCE ✦
                </div>

                <h1>
                    PLAY BEYOND
                    <span>LIMITS.</span>
                </h1>

                <p>
                    Challenge your friends.
                    Outsmart intelligent opponents.
                    Become the Ludo champion.
                </p>

                <div class="hero-board">

                    <div class="board-preview">

                        <div class="board-quadrant red">
                            <span>●</span>
                        </div>

                        <div class="board-quadrant green">
                            <span>●</span>
                        </div>

                        <div class="board-center">
                            <span>♛</span>
                        </div>

                        <div class="board-quadrant yellow">
                            <span>●</span>
                        </div>

                        <div class="board-quadrant blue">
                            <span>●</span>
                        </div>

                    </div>

                </div>

            </section>


            <section class="menu-section">

                <div class="section-heading">
                    <span>CHOOSE YOUR EXPERIENCE</span>
                    <div></div>
                </div>

                <button class="menu-card primary-card"
                        id="playComputer">

                    <span class="card-icon">🤖</span>

                    <span class="card-content">
                        <strong>PLAY VS COMPUTER</strong>
                        <small>Challenge intelligent AI opponents</small>
                    </span>

                    <span class="card-arrow">›</span>

                </button>


                <button class="menu-card"
                        id="localMultiplayer">

                    <span class="card-icon">👥</span>

                    <span class="card-content">
                        <strong>LOCAL MULTIPLAYER</strong>
                        <small>Play together on one device</small>
                    </span>

                    <span class="card-arrow">›</span>

                </button>


                <button class="menu-card"
                        id="mixedMode">

                    <span class="card-icon">🎮</span>

                    <span class="card-content">
                        <strong>MIXED MODE</strong>
                        <small>Humans and AI in one match</small>
                    </span>

                    <span class="card-arrow">›</span>

                </button>

            </section>


            <section class="quick-features">

                <div>
                    <span>🧠</span>
                    <small>SMART AI</small>
                </div>

                <div>
                    <span>📱</span>
                    <small>MOBILE READY</small>
                </div>

                <div>
                    <span>🌐</span>
                    <small>OFFLINE PLAY</small>
                </div>

            </section>


            <footer class="footer">
                <p>© 2026 LUDO ROYALE</p>
                <span>DESIGNED FOR CHAMPIONS ♛</span>
            </footer>

        </main>

    </div>


    <script src="js/ui/board.js"></script>
   <script src="js/core/dice-engine.js"></script>
   <script src="js/core/game-rules.js"></script>
   <script src="js/core/game-state.js"></script>
   <script src="js/ui/game-screen.js"></script>
   <script src="js/app.js"></script>

</body>
      </html>
